name: Phone app validation
on:
  push:
    branches: [phone-apps-v269]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Gameplay and phone checks
        run: |
          node -e "const {spawnSync}=require('node:child_process');let failed=false;for(const command of require('./package.json').scripts.test.split(' && ')){console.log('CHECK_START '+command);const result=spawnSync(command,{shell:true,stdio:'inherit'});if(result.status!==0){failed=true;console.log('CHECK_FAILED '+command)}}process.exit(failed?1:0)"
      - name: TypeScript and production build
        if: always()
        run: npm run build
